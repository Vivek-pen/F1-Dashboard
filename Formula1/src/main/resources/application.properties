spring.application.name=Formula1

server.port=${SERVER_PORT:9090}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/F1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Welcome@1234$}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
telemetry.mode=replay
telemetry.refresh=1000

cors.allowed.origins=${FRONTEND_URL:http://localhost:5173}